# Configuration for the MECA SWORD app. Values marked `secret: true` must come from a secrets
# file (`.app-config.secrets.yml`, never committed) or the APP_CONFIG environment variable.
$schema: http://json-schema.org/draft-07/schema#
title: MECA SWORD
type: object
additionalProperties: false
required: [title, publicUrl, database, session, encryptionKey]
properties:
  title:
    type: string
    description: This system's name, shown in the UI and used as the transfer source in packages it sends
  publicUrl:
    type: string
    description: Public base URL; SWORD URLs are absolute. The PUBLIC_URL environment variable overrides it.
  admins:
    type: array
    description: Emails that are admins (and active) as soon as they sign in
    items: { type: string }
  collections:
    type: array
    description: Collections offered to depositors, each with its own Service-URL
    items:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        title: { type: string }
        abstract: { type: string }
  maxUploadSize:
    type: integer
    description: Largest package accepted, in bytes (Cloud Run allows 32 MiB per HTTP/1 request)
  storage:
    type: object
    description: Where package files go; a GCS bucket when deployed, otherwise a local folder
    additionalProperties: false
    properties:
      bucket: { type: string }
      directory: { type: string }
  database:
    type: object
    additionalProperties: false
    required: [url]
    properties:
      url:
        type: string
        secret: true
        description: Runtime connection (Supabase transaction pooler, port 6543)
      directUrl:
        type: string
        secret: true
        description: Migrations (Supabase direct or session connection, port 5432)
  session:
    type: object
    additionalProperties: false
    required: [secret]
    properties:
      secret:
        type: string
        secret: true
        description: Signs session cookies; changing it signs everyone out
  encryptionKey:
    type: string
    secret: true
    description: Encrypts saved destination credentials; changing it makes them unreadable
  auth:
    type: object
    additionalProperties: false
    properties:
      google: { $ref: '#/definitions/OAuthClient' }
      github: { $ref: '#/definitions/OAuthClient' }
      devLogin:
        type: boolean
        description: Offer "sign in as any email" in development (never in production)
definitions:
  OAuthClient:
    type: object
    additionalProperties: false
    required: [clientId, clientSecret]
    properties:
      clientId: { type: string }
      clientSecret: { type: string, secret: true }
